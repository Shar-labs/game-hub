<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong – GameHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07070f;
      color: #e0e0e0;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #back-link {
      position: fixed;
      top: 14px;
      left: 18px;
      color: #39ff14;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.85;
      transition: opacity 0.2s;
      z-index: 100;
    }
    #back-link:hover { opacity: 1; text-decoration: underline; }
    #back-link::before { content: '← '; }

    h1 {
      margin-top: 10px;
      margin-bottom: 18px;
      font-size: 2rem;
      color: #39ff14;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 12px #39ff1466;
    }

    #game-container {
      position: relative;
      border: 2px solid #39ff1444;
      border-radius: 4px;
      box-shadow: 0 0 30px #39ff1422, 0 0 60px #00000088;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <a id="back-link" href="../../index.html">Back</a>
  <h1>🏓 Ping Pong</h1>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <script src="pingpong.js"></script>
</body>
</html>
