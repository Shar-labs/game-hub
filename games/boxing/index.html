<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxing – GameHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07070f;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      width: 100%;
      max-width: 860px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 8px;
    }

    #back-link {
      text-decoration: none;
      color: #aaa;
      font-size: 13px;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }
    #back-link:hover { color: #fff; }
    #back-link span { margin-right: 6px; font-size: 15px; }

    #game-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }

    /* ── Player name strip ── */
    #namestrip {
      width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px 6px;
    }

    .p-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .p1-label { color: #ff2d55; }
    .p2-label { color: #00aaff; }

    /* ── HP bars ── */
    #hpstrip {
      width: 820px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 8px;
    }

    .hp-wrap {
      flex: 1;
      height: 18px;
      background: #1a1a2e;
      border-radius: 9px;
      border: 1px solid #333;
      overflow: hidden;
      position: relative;
    }
    .hp-bar {
      height: 100%;
      border-radius: 9px;
      transition: width 0.1s;
    }
    #hp-bar-p1 { background: linear-gradient(90deg, #ff2d55, #ff6b82); }
    #hp-bar-p2 { background: linear-gradient(90deg, #00aaff, #66ccff); }
    #hp-wrap-p2 { direction: rtl; }
    #hp-wrap-p2 .hp-bar { direction: ltr; }

    .hp-num {
      min-width: 36px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #ddd;
    }

    /* ── Round label ── */
    #roundlabel {
      min-width: 90px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #888;
    }

    /* ── Canvas wrapper ── */
    #canvas-wrap {
      position: relative;
      border: 2px solid #1e1e30;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(255,45,85,0.08), 0 0 60px rgba(0,170,255,0.06);
    }

    canvas { display: block; }

    /* ── Score pips ── */
    #scorestrip {
      width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px 4px;
    }

    .pips {
      display: flex;
      gap: 6px;
    }

    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #333;
      background: transparent;
    }
    .pip.filled-p1 { background: #ff2d55; border-color: #ff2d55; }
    .pip.filled-p2 { background: #00aaff; border-color: #00aaff; }

    #score-center {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <a id="back-link" href="../../index.html"><span>←</span> HUB</a>
    <div id="game-title">🥊 Boxing</div>
    <div style="width:80px"></div>
  </div>

  <div id="namestrip">
    <div class="p-label p1-label">Player 1</div>
    <div class="p-label p2-label">Player 2</div>
  </div>

  <div id="hpstrip">
    <div class="hp-num" id="hp-num-p1">100</div>
    <div class="hp-wrap" id="hp-wrap-p1"><div class="hp-bar" id="hp-bar-p1" style="width:100%"></div></div>
    <div id="roundlabel">Round 1</div>
    <div class="hp-wrap" id="hp-wrap-p2"><div class="hp-bar" id="hp-bar-p2" style="width:100%"></div></div>
    <div class="hp-num" id="hp-num-p2">100</div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div id="scorestrip">
    <div class="pips" id="pips-p1">
      <div class="pip" id="p1-pip-0"></div>
      <div class="pip" id="p1-pip-1"></div>
      <div class="pip" id="p1-pip-2"></div>
    </div>
    <div id="score-center">BEST OF 5</div>
    <div class="pips" id="pips-p2">
      <div class="pip" id="p2-pip-0"></div>
      <div class="pip" id="p2-pip-1"></div>
      <div class="pip" id="p2-pip-2"></div>
    </div>
  </div>

  <script src="boxing.js"></script>
</body>
</html>
